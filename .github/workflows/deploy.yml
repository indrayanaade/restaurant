runs-on: ubuntu-latest

steps:

  - name: Deploy Server
    uses: appleboy/ssh-action@v1.0.3
    with:
      host: ${{ secrets.SERVER_HOST }}
      username: ${{ secrets.SERVER_USER }}
      key: ${{ secrets.SERVER_SSH_KEY }}

      script: |

        set -e

        echo "=== Server Info ==="

        whoami
        hostname

        echo "=== Pull Latest Code ==="

        cd /storage/source-code/development/restaurant

        git pull origin master

        echo "=== Get Last Image Tag ==="

        LAST_TAG=$(docker images restaurant \
          --format "{{.Tag}}" \
          | grep '^v[0-9]*$' \
          | sed 's/v//' \
          | sort -n \
          | tail -1)

        if [ -z "$LAST_TAG" ]; then
          NEXT_TAG=1
        else
          NEXT_TAG=$((LAST_TAG + 1))
        fi

        NEW_TAG="v${NEXT_TAG}"

        echo "=== Build Image ${NEW_TAG} ==="

        docker build \
          -t restaurant:${NEW_TAG} \
          .

        echo "=== DockerHub Login ==="

        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
          -u "${{ secrets.DOCKER_USERNAME }}" \
          --password-stdin

        echo "=== Tag Image ==="

        docker tag \
          restaurant:${NEW_TAG} \
          indrayanaade/restaurant:${NEW_TAG}

        docker tag \
          restaurant:${NEW_TAG} \
          indrayanaade/restaurant:latest

        echo "=== Push DockerHub ==="

        docker push indrayanaade/restaurant:${NEW_TAG}
        docker push indrayanaade/restaurant:latest

        echo "=== Update Docker Compose ==="

        sed -i \
          "s|image: .*restaurant.*|image: indrayanaade/restaurant:${NEW_TAG}|g" \
          docker-compose.yml

        echo "=== Docker Compose Deploy ==="

        docker compose pull
        docker compose up -d

        echo "=== Kubernetes Deploy ==="

        cd /storage/source-code/development/restaurant-chart

        helm upgrade restaurant . \
          -n app \
          --wait \
          --set restaurant.image.repository=indrayanaade/restaurant \
          --set restaurant.image.tag=${NEW_TAG}

        echo "=== Verify Rollout ==="

        kubectl rollout status deployment/restaurant \
          -n app \
          --timeout=300s

        echo "=== Cleanup Old Images ==="

        docker image prune -af --filter "until=72h"

        echo "=== Deployment Success ==="

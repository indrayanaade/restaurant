name: Deploy Development

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2

  sast:
    runs-on: ubuntu-latest

    needs: secret-scan

    steps:
      - uses: actions/checkout@v4

      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit

  helm-lint:
    runs-on: ubuntu-latest

    needs: sast

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Helm Lint
        run: |
          helm lint restaurant-chart

  deploy:
    runs-on: ubuntu-latest

    needs: helm-lint

    steps:
      - name: Deploy Server
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            set -e

            cd /storage/source-code/development/restaurant

            echo "=== Pull Latest Code ==="
            git pull origin master

            echo "=== Get Last Tag ==="

            LAST_TAG=$(docker images restaurant \
              --format "{{.Tag}}" \
              | grep '^v[0-9]*$' \
              | sed 's/v//' \
              | sort -n \
              | tail -1)

            if [ -z "$LAST_TAG" ]; then
              NEXT_TAG=1
            else
              NEXT_TAG=$((LAST_TAG+1))
            fi

            NEW_TAG="v${NEXT_TAG}"

            echo "=== Build Image ${NEW_TAG} ==="

            docker build \
              -t restaurant:${NEW_TAG} \
              .

            echo "=== DockerHub Login ==="

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
              -u "${{ secrets.DOCKER_USERNAME }}" \
              --password-stdin

            echo "=== Tag DockerHub Image ==="

            docker tag \
              restaurant:${NEW_TAG} \
              indrayanaade/restaurant:${NEW_TAG}

            docker tag \
              restaurant:${NEW_TAG} \
              indrayanaade/restaurant:latest

            echo "=== Push DockerHub ==="

            docker push indrayanaade/restaurant:${NEW_TAG}
            docker push indrayanaade/restaurant:latest

            echo "=== Update Compose ==="

            sed -i \
              "s|image: .*restaurant.*|image: indrayanaade/restaurant:${NEW_TAG}|g" \
              docker-compose.yml

            echo "=== Deploy Docker Compose ==="

            docker compose pull
            docker compose up -d

            echo "=== Deploy Kubernetes ==="

            export KUBECONFIG=/home/indrayanaade/.kube/config

            cd /storage/source-code/development/restaurant-chart

            helm upgrade restaurant . \
              -n app \
              --wait \
              --set restaurant.image.repository=indrayanaade/restaurant \
              --set restaurant.image.tag=${NEW_TAG}

            echo "=== Verify Rollout ==="

            kubectl rollout status deployment/restaurant \
              -n app \
              --timeout=300s

            kubectl get pods -n app

            echo "=== Cleanup Old Images ==="

            docker image prune -af --filter "until=72h"

            echo "=== Deployment Success ==="